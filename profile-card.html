<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自己紹介カード</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }

  .card-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 40px 24px 60px;
    text-align: center;
    position: relative;
  }

  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: #ffffff;
    border: 4px solid rgba(255, 255, 255, 0.8);
    margin: 0 auto -55px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    color: #764ba2;
    font-weight: bold;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    position: relative;
    top: 55px;
  }

  .card-body {
    padding: 70px 28px 32px;
    text-align: center;
  }

  .name {
    font-size: 24px;
    font-weight: 700;
    color: #2d2d2d;
    margin: 0 0 4px;
  }

  .role {
    font-size: 14px;
    color: #764ba2;
    background: #f3e9ff;
    display: inline-block;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
  }

  .bio {
    font-size: 14px;
    line-height: 1.7;
    color: #555;
    margin-bottom: 24px;
  }

  .info-list {
    text-align: left;
    border-top: 1px solid #eee;
    padding-top: 20px;
    margin-bottom: 20px;
  }

  .info-item {
    display: flex;
    align-items: center;
    font-size: 14px;
    color: #444;
    margin-bottom: 12px;
  }

  .info-icon {
    width: 28px;
    font-size: 16px;
    flex-shrink: 0;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 24px;
  }

  .tag {
    background: #f0f0f5;
    color: #555;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 14px;
  }

  .sns {
    display: flex;
    justify-content: center;
    gap: 14px;
  }

  .sns a {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #f0f0f5;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #764ba2;
    font-size: 16px;
    transition: transform 0.2s, background 0.2s;
  }

  .sns a:hover {
    background: #764ba2;
    color: #fff;
    transform: translateY(-3px);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="avatar">👤</div>
    </div>
    <div class="card-body">
      <h1 class="name">山田 太郎</h1>
      <div class="role">Webエンジニア</div>

      <p class="bio">
        はじめまして！フロントエンドを中心に開発をしています。<br>
        新しい技術を学ぶことと、美味しいコーヒーを飲むのが好きです。
      </p>

      <div class="info-list">
        <div class="info-item"><span class="info-icon">📍</span> 東京都</div>
        <div class="info-item"><span class="info-icon">🎂</span> 1995年5月1日生まれ</div>
        <div class="info-item"><span class="info-icon">💼</span> ◯◯株式会社</div>
        <div class="info-item"><span class="info-icon">✉️</span> example@email.com</div>
      </div>

      <div class="tags">
        <span class="tag">#プログラミング</span>
        <span class="tag">#カフェ巡り</span>
        <span class="tag">#旅行</span>
        <span class="tag">#読書</span>
      </div>

      <div class="sns">
        <a href="#" title="X (Twitter)">𝕏</a>
        <a href="#" title="GitHub">GH</a>
        <a href="#" title="Instagram">IG</a>
      </div>
    </div>
  </div>

</body>
</html>
